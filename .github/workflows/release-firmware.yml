name: Release firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release firmware
    if: github.event.created
    uses: ./.github/workflows/build-firmware.yml

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: amity-esp32-${{ github.sha }}
          path: dist

      - name: Create release with firmware and provisioner assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          version="${RELEASE_TAG%%+*}"
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/amity.bin \
            dist/amity.elf \
            dist/amity.map \
            dist/amity-firmware.zip \
            dist/amity-provision/*.zip \
            dist/amity-provision/SHA256SUMS \
            "${flags[@]}"
