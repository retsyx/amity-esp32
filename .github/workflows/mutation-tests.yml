name: Mutation tests

# Runs every tests/mutants manifest against the host tests. Mutants anchor on
# exact firmware text, so they stay out of the push and pull request checks.
# The weekly run is opt-in: set the repository variable AMITY_WEEKLY_MUTANTS to
# true. A run can also be started by hand.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus:
    name: Find mutation manifests
    if: github.event_name == 'workflow_dispatch' || vars.AMITY_WEEKLY_MUTANTS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      count: ${{ steps.count.outputs.count }}
    steps:
      - name: Check out firmware
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Count manifests
        id: count
        run: echo "count=$(find tests/mutants -name '*.json' 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

  mutants:
    name: Host test mutants
    needs: corpus
    if: needs.corpus.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      IDF_PATH: ${{ github.workspace }}/.cache/esp-idf
      ESP_MATTER_PATH: ${{ github.workspace }}/.cache/esp-matter
      IDF_TOOLS_PATH: ${{ github.workspace }}/.cache/espressif
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Check out firmware
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: amity-provision/go.mod
          cache-dependency-path: amity-provision/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Read pinned SDK commits
        id: sdk
        run: python3 tools/sdk_versions.py >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            git wget flex bison gperf gcc g++ pkg-config cmake ninja-build ccache \
            curl unzip python3-venv python3-dev python3-pip libffi-dev libssl-dev \
            dfu-util libusb-1.0-0 libdbus-1-dev libglib2.0-dev libavahi-client-dev \
            libgirepository1.0-dev libcairo2-dev libreadline-dev libevent-dev default-jre

      # The same SDK installation as the Build firmware workflow.
      - name: Restore SDKs and tools
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/esp-idf
            .cache/esp-matter
            .cache/espressif
          key: sdk-${{ runner.os }}-python${{ steps.python.outputs.python-version }}-${{ hashFiles('SDK_VERSIONS.txt') }}

      - name: Check out ESP-IDF
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-idf
          ref: ${{ steps.sdk.outputs.idf }}
          path: .cache/esp-idf
          persist-credentials: false

      - name: Check out ESP-Matter
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-matter
          ref: ${{ steps.sdk.outputs.matter }}
          path: .cache/esp-matter
          persist-credentials: false

      - name: Initialize SDK submodules
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          CHIP_COMMIT: ${{ steps.sdk.outputs.chip }}
        run: |
          git -C "$IDF_PATH" submodule update --init --recursive --depth 1 --jobs 4
          git -C "$ESP_MATTER_PATH" submodule update --init --depth 1 connectedhomeip/connectedhomeip
          chip_path="$ESP_MATTER_PATH/connectedhomeip/connectedhomeip"
          if [[ "$(git -C "$chip_path" rev-parse HEAD)" != "$CHIP_COMMIT" ]]; then
            echo "ConnectedHomeIP does not match SDK_VERSIONS.txt" >&2
            exit 1
          fi
          cd "$chip_path"
          python3 scripts/checkout_submodules.py --platform esp32 linux --shallow --jobs 4

      - name: Install SDK tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          "$IDF_PATH/install.sh" esp32s3
          source "$IDF_PATH/export.sh"
          "$ESP_MATTER_PATH/install.sh" --no-host-tool

      - name: Save SDKs and tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/esp-idf
            .cache/esp-matter
            .cache/espressif
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('SDK_VERSIONS.txt') }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ hashFiles('SDK_VERSIONS.txt') }}-

      # The SDK-tier host tests read managed components and firmware build output.
      - name: Build firmware
        run: |
          source tools/env.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Run every mutation manifest
        run: |
          source tools/env.sh
          python3 tools/check_test_mutants.py --all --json test-results/mutants.json

      - name: Upload mutant outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-${{ github.sha }}
          path: test-results/mutants.json
          if-no-files-found: ignore
          retention-days: 30
