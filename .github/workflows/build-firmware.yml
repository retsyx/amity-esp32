name: Build firmware

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag; must match the committed firmware version
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ESP32-S3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      IDF_PATH: ${{ github.workspace }}/.cache/esp-idf
      ESP_MATTER_PATH: ${{ github.workspace }}/.cache/esp-matter
      IDF_TOOLS_PATH: ${{ github.workspace }}/.cache/espressif
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      RELEASE_TAG: ${{ inputs.release_tag || '' }}

    steps:
      - name: Check out firmware
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: amity-provision/go.mod
          cache-dependency-path: amity-provision/go.sum

      - name: Validate release version
        if: inputs.release_tag != ''
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = re.search(r'^set\(PROJECT_VER "([^"]+)"',
                              Path('CMakeLists.txt').read_text(), re.MULTILINE)
          if version is None or tag != 'v' + version[1]:
              raise SystemExit('Release tag must be v followed by PROJECT_VER from CMakeLists.txt')
          print(f'Releasing Amity {version[1]} from {tag}')
          PY

      - name: Read pinned SDK commits
        id: sdk
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          versions = Path('SDK_VERSIONS.txt').read_text()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, label in (
                  ('idf', 'ESP-IDF'),
                  ('matter', 'ESP-Matter'),
                  ('chip', 'ConnectedHomeIP'),
              ):
                  match = re.search(
                      rf'^{label}(?: [^:]+)?: ([0-9a-f]{{40}})$', versions, re.MULTILINE
                  )
                  if match is None:
                      raise SystemExit(f'Missing pinned {label} commit in SDK_VERSIONS.txt')
                  print(f'{name}={match[1]}', file=output)
          PY

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            git wget flex bison gperf gcc g++ pkg-config cmake ninja-build ccache \
            curl unzip python3-venv python3-dev python3-pip libffi-dev libssl-dev \
            dfu-util libusb-1.0-0 libdbus-1-dev libglib2.0-dev libavahi-client-dev \
            libgirepository1.0-dev libcairo2-dev libreadline-dev libevent-dev default-jre

      - name: Check out ESP-IDF
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-idf
          ref: ${{ steps.sdk.outputs.idf }}
          path: .cache/esp-idf
          persist-credentials: false

      - name: Check out ESP-Matter
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-matter
          ref: ${{ steps.sdk.outputs.matter }}
          path: .cache/esp-matter
          persist-credentials: false

      - name: Initialize SDK submodules
        env:
          CHIP_COMMIT: ${{ steps.sdk.outputs.chip }}
        run: |
          git -C "$IDF_PATH" submodule update --init --recursive --depth 1 --jobs 4
          git -C "$ESP_MATTER_PATH" submodule update --init --depth 1 connectedhomeip/connectedhomeip
          chip_path="$ESP_MATTER_PATH/connectedhomeip/connectedhomeip"
          if [[ "$(git -C "$chip_path" rev-parse HEAD)" != "$CHIP_COMMIT" ]]; then
            echo "ConnectedHomeIP does not match SDK_VERSIONS.txt" >&2
            exit 1
          fi
          cd "$chip_path"
          python3 scripts/checkout_submodules.py --platform esp32 linux --shallow --jobs 4

      - name: Install SDK tools
        run: |
          "$IDF_PATH/install.sh" esp32s3
          source "$IDF_PATH/export.sh"
          "$ESP_MATTER_PATH/install.sh" --no-host-tool

      - name: Build firmware and provisioning package
        run: |
          source tools/env.sh
          idf.py set-target esp32s3
          idf.py build provisioning-package

      - name: Build provisioner release packages
        run: python3 amity-provision/build_release.py

      - name: Prepare downloadable release assets
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import zipfile

          build = Path('build')
          with zipfile.ZipFile(build / 'amity-firmware.zip') as package:
              version = json.loads(package.read('manifest.json'))['firmware_version']
          tag = os.environ['RELEASE_TAG']
          if tag and tag != 'v' + version:
              raise SystemExit('Built firmware version does not match release tag')
          sources = [build / name for name in
                     ('amity.bin', 'amity.elf', 'amity.map', 'amity-firmware.zip')]
          sources.append(Path('README.md'))
          sources.extend(build / 'amity-provision' / f'amity-provision-{system}-{arch}.zip'
                         for system in ('darwin', 'windows', 'linux')
                         for arch in ('amd64', 'arm64'))
          destination = build / 'release'
          destination.mkdir(exist_ok=True)
          checksums = []
          for source in sorted(sources, key=lambda path: path.name):
              target = destination / source.name
              shutil.copyfile(source, target)
              if tag and source == Path('README.md'):
                  guide = target.read_bytes()
                  for kind in ('blob', 'tree'):
                      guide = guide.replace(
                          f'https://github.com/retsyx/amity-esp32/{kind}/main/'.encode(),
                          f'https://github.com/retsyx/amity-esp32/{kind}/{tag}/'.encode())
                  target.write_bytes(guide)
              checksums.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {target.name}')
          (destination / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n')
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: amity-esp32-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
