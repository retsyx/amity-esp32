name: Build firmware

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag; must match the committed firmware version
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Web UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out firmware
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install browser test dependencies
        run: |
          python3 -m pip install -c cec-harness/runtime-requirements.txt playwright
          python3 -m playwright install --with-deps chromium

      - name: Run browser suites
        run: |
          for suite in tests/web_*_ui.py; do
            echo "::group::$suite"
            python3 "$suite"
            echo "::endgroup::"
          done

  build:
    name: ESP32-S3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      IDF_PATH: ${{ github.workspace }}/.cache/esp-idf
      ESP_MATTER_PATH: ${{ github.workspace }}/.cache/esp-matter
      IDF_TOOLS_PATH: ${{ github.workspace }}/.cache/espressif
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      RELEASE_TAG: ${{ inputs.release_tag || '' }}

    steps:
      - name: Check out firmware
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: amity-provision/go.mod
          cache-dependency-path: amity-provision/go.sum

      - name: Set up Node.js for host tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate release version
        if: inputs.release_tag != ''
        run: python3 tools/release_version.py "$RELEASE_TAG"

      - name: Read pinned SDK commits
        id: sdk
        run: python3 tools/sdk_versions.py >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            git wget flex bison gperf gcc g++ pkg-config cmake ninja-build ccache \
            curl unzip python3-venv python3-dev python3-pip libffi-dev libssl-dev \
            dfu-util libusb-1.0-0 libdbus-1-dev libglib2.0-dev libavahi-client-dev \
            libgirepository1.0-dev libcairo2-dev libreadline-dev libevent-dev default-jre

      - name: Check out ESP-IDF
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-idf
          ref: ${{ steps.sdk.outputs.idf }}
          path: .cache/esp-idf
          persist-credentials: false

      - name: Check out ESP-Matter
        uses: actions/checkout@v7
        with:
          repository: espressif/esp-matter
          ref: ${{ steps.sdk.outputs.matter }}
          path: .cache/esp-matter
          persist-credentials: false

      - name: Initialize SDK submodules
        env:
          CHIP_COMMIT: ${{ steps.sdk.outputs.chip }}
        run: |
          git -C "$IDF_PATH" submodule update --init --recursive --depth 1 --jobs 4
          git -C "$ESP_MATTER_PATH" submodule update --init --depth 1 connectedhomeip/connectedhomeip
          chip_path="$ESP_MATTER_PATH/connectedhomeip/connectedhomeip"
          if [[ "$(git -C "$chip_path" rev-parse HEAD)" != "$CHIP_COMMIT" ]]; then
            echo "ConnectedHomeIP does not match SDK_VERSIONS.txt" >&2
            exit 1
          fi
          cd "$chip_path"
          python3 scripts/checkout_submodules.py --platform esp32 linux --shallow --jobs 4

      - name: Install SDK tools
        run: |
          "$IDF_PATH/install.sh" esp32s3
          source "$IDF_PATH/export.sh"
          "$ESP_MATTER_PATH/install.sh" --no-host-tool

      - name: Build firmware and provisioning package
        run: |
          source tools/env.sh
          idf.py set-target esp32s3
          idf.py build provisioning-package

      # Host tests use the pinned SDK, managed components and generated build configuration.
      - name: Run firmware host tests
        run: |
          source tools/env.sh
          sh tests/run_host_tests.sh

      - name: Build provisioner release packages
        run: python3 amity-provision/build_release.py

      - name: Prepare downloadable release assets
        run: python3 tools/release_assets.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: amity-esp32-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
